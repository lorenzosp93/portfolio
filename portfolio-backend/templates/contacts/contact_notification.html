<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New portfolio message</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f5f1e9; color: #15202b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background: #f5f1e9;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 600px; background: #ffffff; border: 1px solid #dce4e3; border-radius: 18px; overflow: hidden;">
            <tr>
              <td style="padding: 28px 32px; background: #0f7f76; color: #ffffff;">
                <p style="margin: 0 0 8px; color: #c9f4ed; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;">lorenzosp.com</p>
                <h1 style="margin: 0; font-size: 26px; line-height: 1.25;">New portfolio message</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 32px 12px;">
                <p style="margin: 0 0 6px; font-size: 18px; line-height: 1.5; font-weight: 700;">{{ submission.first_name }} {{ submission.last_name }}</p>
                <p style="margin: 0 0 6px; font-size: 15px; line-height: 1.5;">
                  <a href="mailto:{{ submission.email }}" style="color: #0f7f76; text-decoration: underline;">{{ submission.email }}</a>
                </p>
                <p style="margin: 0; color: #667085; font-size: 13px; line-height: 1.5;">Received {{ submission.submitted_at|date:"j F Y, H:i T" }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 32px;">
                <div style="padding: 22px 24px; background: #f6f9f8; border-left: 4px solid #f47764; border-radius: 8px; font-size: 16px; line-height: 1.65; overflow-wrap: anywhere;">
                  {{ submission.content|linebreaksbr }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 18px 32px; background: #eef5f3; color: #52606d; font-size: 13px; line-height: 1.5;">
                Reply to this email to respond directly to {{ submission.first_name }}.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
